<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="600" fill="#f8fafc"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="64" fill="#1e293b"/>
  <text x="32" y="40" fill="#f1f5f9" font-size="20" font-weight="bold">Sistema de Gestión de Inventario</text>

  <!-- Back button -->
  <text x="32" y="100" fill="#0ea5e9" font-size="13" font-weight="bold">← Volver</text>

  <!-- Title row -->
  <text x="32" y="136" fill="#0f172a" font-size="24" font-weight="bold">Lote LOTE-A</text>
  <rect x="660" y="116" width="108" height="28" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="668" y="135" fill="#475569" font-size="11">Producto: Martillo</text>

  <!-- Info cards row -->
  <rect x="32" y="156" width="170" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="48" y="180" fill="#64748b" font-size="11">Cantidad Inicial</text>
  <text x="48" y="206" fill="#0f172a" font-size="16" font-weight="bold">100 piezas</text>

  <rect x="214" y="156" width="170" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="230" y="180" fill="#64748b" font-size="11">Movimiento Neto</text>
  <text x="230" y="206" fill="#16a34a" font-size="16" font-weight="bold">+50 piezas</text>

  <rect x="396" y="156" width="170" height="72" rx="8" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1"/>
  <text x="412" y="180" fill="#0284c7" font-size="11">Cantidad Disponible</text>
  <text x="412" y="206" fill="#0369a1" font-size="22" font-weight="bold">150 piezas</text>

  <rect x="578" y="156" width="190" height="72" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="594" y="180" fill="#64748b" font-size="11">Vencimiento</text>
  <text x="594" y="206" fill="#0f172a" font-size="16" font-weight="bold">31/12/2026</text>

  <!-- Section title + New movement button -->
  <text x="32" y="268" fill="#0f172a" font-size="18" font-weight="bold">Movimientos de Stock (3)</text>
  <rect x="620" y="252" width="148" height="32" rx="6" fill="#0ea5e9"/>
  <text x="694" y="273" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">+ Nuevo Movimiento</text>

  <!-- Movements table header -->
  <rect x="32" y="288" width="736" height="36" rx="6" fill="#e2e8f0"/>
  <text x="48" y="312" fill="#475569" font-size="11" font-weight="bold">TIPO</text>
  <text x="160" y="312" fill="#475569" font-size="11" font-weight="bold">CANTIDAD</text>
  <text x="300" y="312" fill="#475569" font-size="11" font-weight="bold">RAZÓN</text>
  <text x="480" y="312" fill="#475569" font-size="11" font-weight="bold">FECHA</text>
  <text x="640" y="312" fill="#475569" font-size="11" font-weight="bold">ACCIONES</text>

  <!-- Movement row 1: Ingreso -->
  <line x1="32" y1="324" x2="768" y2="324" stroke="#f1f5f9" stroke-width="1"/>
  <rect x="48" y="332" width="80" height="24" rx="12" fill="#dcfce7"/>
  <text x="58" y="349" fill="#16a34a" font-size="11" font-weight="bold">+ Ingreso</text>
  <text x="160" y="349" fill="#0f172a" font-size="13">30 piezas</text>
  <text x="300" y="349" fill="#334155" font-size="13">Reposición</text>
  <text x="480" y="349" fill="#64748b" font-size="12">01/06/2026 10:30</text>
  <rect x="640" y="332" width="56" height="24" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="648" y="349" fill="#dc2626" font-size="10">Eliminar</text>

  <!-- Movement row 2: Egreso -->
  <line x1="32" y1="364" x2="768" y2="364" stroke="#f1f5f9" stroke-width="1"/>
  <rect x="48" y="372" width="80" height="24" rx="12" fill="#fee2e2"/>
  <text x="60" y="389" fill="#dc2626" font-size="11" font-weight="bold">- Egreso</text>
  <text x="160" y="389" fill="#0f172a" font-size="13">20 piezas</text>
  <text x="300" y="389" fill="#334155" font-size="13">Venta</text>

  <!-- Movement row 3: Ingreso -->
  <line x1="32" y1="404" x2="768" y2="404" stroke="#f1f5f9" stroke-width="1"/>
  <rect x="48" y="412" width="80" height="24" rx="12" fill="#dcfce7"/>
  <text x="58" y="429" fill="#16a34a" font-size="11" font-weight="bold">+ Ingreso</text>
  <text x="160" y="429" fill="#0f172a" font-size="13">40 piezas</text>
  <text x="300" y="429" fill="#334155" font-size="13">Devolución</text>

  <!-- Label -->
  <rect x="32" y="480" width="100" height="20" rx="4" fill="#e2e8f0"/>
  <text x="40" y="494" fill="#64748b" font-size="10" font-weight="bold">WIREFRAME 3</text>
  <text x="144" y="494" fill="#94a3b8" font-size="10">Movimientos de lote (REQ-F03, REQ-F04)</text>
</svg>
