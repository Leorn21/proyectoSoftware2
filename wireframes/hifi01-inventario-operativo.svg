<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="48%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="headerBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(56,189,248,0.18)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="640" fill="url(#bg)"/>
  <ellipse cx="450" cy="0" rx="500" ry="180" fill="url(#glow)"/>

  <!-- Header -->
  <rect x="0" y="0" width="900" height="80" fill="url(#headerBg)" stroke="#1e293b" stroke-width="1"/>
  <text x="40" y="30" fill="#7dd3fc" font-size="10" font-weight="bold" letter-spacing="3">INVENTARIO INTELIGENTE</text>
  <text x="40" y="56" fill="#f8fafc" font-size="22" font-weight="bold">Gestor de Inventario</text>
  <text x="40" y="72" fill="#94a3b8" font-size="11">Sistema de gestión de productos, lotes y movimientos</text>

  <!-- Stats badge -->
  <rect x="710" y="16" width="160" height="48" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="726" y="36" fill="#94a3b8" font-size="12"><tspan fill="#7dd3fc" font-weight="bold">5</tspan> productos | <tspan fill="#7dd3fc" font-weight="bold">12</tspan> lotes</text>
  <text x="726" y="52" fill="#64748b" font-size="10">stock actualizado</text>

  <!-- Search + Quick panel card -->
  <rect x="40" y="104" width="820" height="100" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Search section -->
  <rect x="40" y="104" width="540" height="100" rx="16" fill="none"/>
  <rect x="60" y="122" width="20" height="20" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="68" cy="130" r="6" fill="none" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="88" y="136" fill="#f1f5f9" font-size="14" font-weight="bold">Explorar productos</text>
  <text x="88" y="152" fill="#64748b" font-size="11">Buscá por código, nombre, descripción o categoría.</text>
  <rect x="60" y="166" width="440" height="28" rx="10" fill="#020617" stroke="#334155" stroke-width="1"/>
  <text x="76" y="185" fill="#475569" font-size="11">Buscar por código, nombre, categoría...</text>

  <!-- Quick panel -->
  <rect x="590" y="112" width="250" height="84" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="606" y="120" width="56" height="56" rx="12" fill="#020617" stroke="#1e293b" stroke-width="1"/>
  <text x="610" y="145" fill="#7dd3fc" font-size="20" text-anchor="middle">&#x25a1;</text>
  <text x="670" y="138" fill="#f1f5f9" font-size="12" font-weight="bold">Panel rápido</text>
  <text x="670" y="152" fill="#64748b" font-size="10">Creá productos y mantené el inventario al día.</text>
  <rect x="606" y="164" width="220" height="26" rx="8" fill="#0284c7"/>
  <text x="716" y="182" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">+ Nuevo Producto</text>

  <!-- Section title -->
  <text x="40" y="236" fill="#f1f5f9" font-size="18" font-weight="bold">Lista de Productos</text>

  <!-- Table card -->
  <rect x="40" y="252" width="820" height="340" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>

  <!-- Table header -->
  <rect x="40" y="252" width="820" height="44" rx="12" fill="#0f172a"/>
  <rect x="40" y="284" width="820" height="12" fill="#0f172a"/>
  <text x="56" y="278" fill="#64748b" font-size="10" font-weight="bold" letter-spacing="2">CÓDIGO</text>
  <text x="200" y="278" fill="#64748b" font-size="10" font-weight="bold" letter-spacing="2">NOMBRE</text>
  <text x="360" y="278" fill="#64748b" font-size="10" font-weight="bold" letter-spacing="2">DESCRIPCIÓN</text>
  <text x="540" y="278" fill="#64748b" font-size="10" font-weight="bold" letter-spacing="2">CATEGORÍA</text>
  <text x="660" y="278" fill="#64748b" font-size="10" font-weight="bold" letter-spacing="2">STOCK</text>
  <text x="760" y="278" fill="#64748b" font-size="10" font-weight="bold" letter-spacing="2">ACCIONES</text>

  <!-- Divider -->
  <line x1="40" y1="296" x2="860" y2="296" stroke="#1e293b" stroke-width="1"/>

  <!-- Row 1 -->
  <line x1="56" y1="340" x2="844" y2="340" stroke="#0f172a" stroke-width="1"/>
  
  <text x="56" y="330" fill="#f1f5f9" font-size="13" font-weight="bold">HER-001</text>
  <text x="200" y="330" fill="#e2e8f0" font-size="13">Martillo</text>
  <text x="360" y="330" fill="#64748b" font-size="12">Martillo de acero para...</text>
  <rect x="540" y="318" width="82" height="24" rx="12" fill="#0ea5e9" fill-opacity="0.1"/>
  <text x="552" y="335" fill="#7dd3fc" font-size="11">Herramientas</text>
  <rect x="660" y="318" width="72" height="24" rx="12" fill="#166534" fill-opacity="0.3"/>
  <text x="672" y="335" fill="#4ade80" font-size="11" font-weight="bold">120 piezas</text>
  <rect x="758" y="318" width="44" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="766" y="335" fill="#cbd5e1" font-size="10">Lotes</text>
  <rect x="808" y="318" width="44" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="816" y="335" fill="#cbd5e1" font-size="10">Editar</text>

  <!-- Row 2 -->
  <text x="56" y="368" fill="#f1f5f9" font-size="13" font-weight="bold">MAT-200</text>
  <text x="200" y="368" fill="#e2e8f0" font-size="13">Clavos</text>
  <text x="360" y="368" fill="#64748b" font-size="12">Clavo galvanizado 2...</text>
  <rect x="540" y="356" width="72" height="24" rx="12" fill="#d97706" fill-opacity="0.15"/>
  <text x="552" y="373" fill="#fbbf24" font-size="11">Materiales</text>
  <rect x="660" y="356" width="64" height="24" rx="12" fill="#166534" fill-opacity="0.3"/>
  <text x="672" y="373" fill="#4ade80" font-size="11" font-weight="bold">50 kg</text>

  <!-- Row 3 -->
  <text x="56" y="406" fill="#f1f5f9" font-size="13" font-weight="bold">EQP-001</text>
  <text x="200" y="406" fill="#e2e8f0" font-size="13">Taladro</text>
  <text x="360" y="406" fill="#64748b" font-size="12">Taladro percutor pro...</text>
  <rect x="540" y="394" width="64" height="24" rx="12" fill="#8b5cf6" fill-opacity="0.15"/>
  <text x="552" y="411" fill="#a78bfa" font-size="11">Equipos</text>
  <rect x="660" y="394" width="56" height="24" rx="12" fill="#7f1d1d" fill-opacity="0.4"/>
  <text x="672" y="411" fill="#fca5a5" font-size="11" font-weight="bold">0 piezas</text>

  <!-- Summary -->
  <rect x="40" y="560" width="820" height="32" rx="0" fill="#0f172a"/>
  <text x="56" y="580" fill="#64748b" font-size="11">Total: <tspan fill="#e2e8f0" font-weight="bold">5</tspan> producto(s)</text>

  <!-- Label -->
  <text x="40" y="620" fill="#1e293b" font-size="9" font-weight="bold" letter-spacing="2">ALTA FIDELIDAD 1</text>
  <text x="156" y="620" fill="#334155" font-size="9">Inventario operativo â€” listado de productos con stock</text>
</svg>
